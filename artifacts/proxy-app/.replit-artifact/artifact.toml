kind = "web"
previewPath = "/"
title = "Web Proxy"
version = "1.0.0"
id = "artifacts/proxy-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20976

[services.development]
run = "pnpm --filter @workspace/proxy-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proxy-app", "run", "build" ]
publicDir = "artifacts/proxy-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20976"
BASE_PATH = "/"
